   return {text}}
  throw new Error('কোনো Gemini মডেল পাওয়া যায়নি ('+last+')')}};

const DICT=[["PDF, ছবি বা টেক্সট ফাইল দিন, অথবা মেসেঞ্জার/WhatsApp-এর মেসেজ কপি করে পেস্ট করুন। টিমের নাম, ফোন, ঠিকানা, কোন ফ্যাব্রিকে কোন কলার আর হাতা কত পিস, আর প্লেয়ারদের নাম-নাম্বার-সাইজ নিজে বের হবে। দাম সবসময় আপনার প্রাইস লিস্ট থেকে বসবে, ফাইলে দাম না থাকলেও।", "Add a PDF, image or text file, or copy-paste a Messenger/WhatsApp message. Team name, phone, address, which fabric/collar/sleeve and how many pieces, and players' names-numbers-sizes are picked out automatically. Prices always come from your price list, even if the file has none."], ["কাস্টমারের দাম আপনার প্রাইস লিস্ট (PDF) থেকে বসানো। প্রোভাইডারের (পাইকারি) দাম একবার বসিয়ে দিন, তাহলে প্রতিটা অর্ডারে লাভ নিজে হিসাব হবে। ভি নেক রাউন্ড নেকের দামে, আর ডাবল ভি ও কাস্টম কলার পোলোর দামে ধরা হয়।", "Customer prices come from your price list (PDF). Enter the provider's (wholesale) prices once and every order's profit is calculated automatically. V neck uses the round-neck price; double V and custom collars use the polo price."], ["\"দাম হিসাব\" পেজের \"অর্ডার সহকারী\"-তে কাস্টমারের মেসেজ পেস্ট করুন, PDF বা ছবি দিন, অথবা নিজের মতো লিখুন। কাস্টমার টোটাল, প্রোভাইডার টোটাল আর লাভ সাথে সাথে আসবে। \"কপি\" চেপে কোটেশন পাঠান।", "In the \"Order assistant\" on the \"Price calculator\" page, paste the customer's message, add a PDF or image, or just type. Customer total, provider total and profit appear instantly. Press \"Copy\" to send the quote."], ["\"দাম হিসাব\" পেজে ফ্যাব্রিক, হাফ/ফুল হাতা, কলার আর পিস দিন, অথবা ক্লায়েন্টের লিস্ট পেস্ট করে \"লিস্ট থেকে গুনুন\" চাপুন। মোট দাম বের হবে, \"কপি\" চেপে ক্লায়েন্টকে পাঠিয়ে দিন।", "On the \"Price calculator\" page enter fabric, half/full sleeve, collar and quantity, or paste the client's list and press \"Count from list\". Then press \"Copy\" and send the price to the client."], ["PDF, ছবি আর মেসেজ নির্ভুলভাবে পড়ে পিস গুনতে Gemini ব্যবহার হয়। Google AI Studio-র ফ্রি API key লাগবে, কোনো কার্ড লাগে না। key শুধু আপনার Firebase ডেটাবেসে থাকে।", "Gemini reads PDFs, images and messages accurately and counts pieces. Needs a free Google AI Studio API key, no card. The key stays only in your Firebase database."], ["ক্লায়েন্টের পাঠানো লিস্ট পেস্ট করুন, প্রতি লাইনে: নাম, নাম্বার, সাইজ, হাফ/ফুল। তারপর বোতাম চাপলে হাফ, ফুল আর 4XL+ পিস নিজে গুনে বসে যাবে। কলার উপরে বেছে নিন।", "Paste the client's list, one per line: name, number, size, half/full. Press the button and half, full and 4XL+ pieces are counted automatically. Choose collars above."], ["লগইন করলে সব ডেটা আপনার Gmail-এর Google Drive-এ থাকবে। অন্য পিসিতে একই Gmail দিয়ে লগইন করলেই সব দেখাবে। ইন্টারনেট না থাকলেও কাজ চলবে, নেট এলে নিজে সিঙ্ক হবে।", "After login all data is kept in your Gmail's Google Drive. Log in with the same Gmail on another PC and everything appears. Works without internet too — it syncs when you're back online."], ["লগইন করলে সব অর্ডার আর হিসাব আপনার Gmail-এর আন্ডারে Firebase ডেটাবেসে থাকবে। অন্য পিসিতে একই Gmail দিয়ে লগইন করলেই সব দেখাবে। ইন্টারনেট না থাকলেও কাজ চলবে।", "After login all orders and accounts are kept in the Firebase database under your Gmail. Log in with the same Gmail on another PC and everything appears. Works without internet too."], ["বিক্রির দাম আপনার প্রাইস লিস্ট (PDF) থেকে বসানো। প্রোভাইডার খরচ আপনি বসাবেন। এই ভিত্তি দামের সাথে নিচের এক্সট্রা চার্জ যোগ হয়ে বাকি সব দাম তৈরি হয়।", "Selling prices come from your price list (PDF). You enter the provider cost. All other prices are this base price plus the extra charges below."], ["। আমি অর্ডার সাজিয়ে কাস্টমার টোটাল, প্রোভাইডার টোটাল আর লাভ হিসাব করে দেব। পরে \"৫টা বাড়াও\" বা \"ফ্যাব্রিক বক্স মেশ করো\" লিখেও বদলাতে পারবেন।", ". I'll organise the order and work out the customer total, provider total and profit. Later you can write \"add 5 more\" or \"change fabric to box mesh\" to update it."], ["এই মাসে এখনো কিছু লেখা হয়নি। অ্যাড অ্যাকাউন্টে টাকা ঢোকালে \"টাকা ঢুকিয়েছি\", আর Ads Manager-এ যা খরচ হলো সেটা \"খরচ হয়েছে\" হিসেবে লিখুন।", "Nothing logged this month. Log top-ups as \"Added money\" and Ads Manager spend as \"Spent\"."], ["মুছে ফেলা অর্ডার এখানে থাকে। চাইলে ফিরিয়ে আনতে পারবেন। \"চিরতরে মুছুন\" চাপলে ডেটাবেস থেকে পুরোপুরি মুছে যাবে, আর ফেরত আনা যাবে না।", "Deleted orders stay here and can be restored. \"Delete forever\" removes them from the database completely; they cannot be recovered."], ["ChatGPT বা অন্য AI টুলকে বলুন অর্ডারটা নিচের মতো করে লিখে PDF বানাতে, তাহলে সবচেয়ে নিখুঁতভাবে পড়া যাবে। দাম লেখার দরকার নেই।", "Ask ChatGPT or any AI tool to write the order like below and make a PDF — it reads most accurately. No prices needed."], ["ফ্যাব্রিক আর কলার বাছুন, তারপর হাফ আর ফুল হাতা কয় পিস লিখুন। দাম প্রাইস লিস্ট থেকে নিজে বসে। 4XL বা তার বড় সাইজে প্রতি পিস", "Pick fabric and collar, then enter how many half and full sleeve pieces. Prices fill in from your price list. 4XL and larger add per piece"], ["কাস্টমারের PDF, ছবি বা মেসেজ দিন। ফ্যাব্রিক, কলার, হাতা, পিস আর নাম-সাইজ নিজে বসে যাবে, দাম আসবে আপনার প্রাইস লিস্ট থেকে।", "Give the customer's PDF, image or message. Fabric, collar, sleeve, pieces and names/sizes fill in automatically; prices come from your price list."], ["এই তালিকায় কোনো অর্ডার নেই। ক্লায়েন্ট নক করলে \"দাম হিসাব\" থেকে দাম বলে দিন, রাজি হলে সেখান থেকেই অর্ডার খুলুন।", "No orders in this list. When a client messages, quote from the \"Price calculator\" and open the order from there once they agree."], ["\"প্রোভাইডারের জন্য শিট\" কপি করে পাঠান। কত টাকা অ্যাডভান্স দিতে হবে সেটা \"টাকার পথ\"-এ লেখা থাকবে। দিয়ে টিক দিন।", "Copy the \"Sheet for provider\" and send it. The advance to pay is shown under \"Money flow\". Tick once paid."], ["\"দাম ও সেটিং\" পেজে প্রতিটা ফ্যাব্রিকের প্রোভাইডার খরচ বসিয়ে সেভ করুন। বিক্রির দাম PDF থেকে আগেই বসানো আছে।", "Enter each fabric's provider cost on the \"Prices & settings\" page and save. Selling prices are already filled in from the PDF."], ["Beatrate Production-এর লোগো বসানো আছে। অন্য লোগো দিতে চাইলে PNG/JPG দিন, তারপর নিচে \"সেটিং সেভ করুন\" চাপুন।", "The Beatrate Production logo is set. To use a different logo, upload a PNG/JPG, then press \"Save settings\" below."], ["কিছু জার্সির প্রোভাইডার খরচ বসানো নেই, তাই লাভের হিসাব ঠিক হবে না। \"দাম ও সেটিং\" পেজে প্রোভাইডার খরচ দিন।", "Some jerseys have no provider cost, so profit will be wrong. Add provider costs on the \"Prices & settings\" page."], ["আপনার লোগো আইকন (PNG/JPG) দিন। মেনু আর ক্যাশ মেমোতে এটা দেখাবে। তারপর নিচে \"সেটিং সেভ করুন\" চাপুন।", "Upload your logo icon (PNG/JPG). It shows in the menu and on cash memos. Then press \"Save settings\" below."], ["কাস্টমার আর প্রোভাইডার দুইটা দামের লিস্টই আগে থেকে বসানো আছে। বদলাতে চাইলে \"দাম ও সেটিং\" পেজে যান।", "Customer and provider price lists are already filled in. To change them, go to \"Prices & settings\"."], ["বড় সাইজের চার্জ। কোনো কলারে প্রাইস লিস্টের উপরে আলাদা টাকা নিতে চাইলে এখানে দিন, না হলে ০ রাখুন।", "Large-size charge. To charge extra for a collar on top of the price list, enter it here; otherwise keep 0."], ["তারপর এই সফটওয়্যার নিজে থেকে AI খুঁজে নেবে। AI না থাকলেও অর্ডার সহকারী নিজস্ব নিয়মে কাজ করবে।", "The software then finds the AI by itself. Without AI the assistant still works with its built-in rules."], ["এই মাসে এখনো কোনো অ্যাড খরচ লেখা হয়নি। প্রতিদিন Ads Manager থেকে খরচটা এখানে লিখে রাখুন।", "No ad spend logged this month yet. Log the daily spend from Ads Manager here."], ["মেসেজ, PDF বা ছবি দিন, অথবা নিজে বসান। কাস্টমার টোটাল, প্রোভাইডার টোটাল আর লাভ সাথে সাথে।", "Give a message, PDF or image, or enter it yourself. Customer total, provider total and profit instantly."], ["অ্যাডভান্স আপনার লাভের চেয়ে কম, তাই প্রোভাইডারকে অ্যাডভান্স দেওয়ার মতো টাকা থাকছে না।", "The advance is less than your profit, so nothing is left to advance the provider."], ["প্রোভাইডার কলামে ধরে নেওয়া হয়েছে প্রোভাইডারও একই এক্সট্রা নেয়। আলাদা হলে বদলে দিন।", "The provider column assumes the provider charges the same extras. Change it if different."], ["\"কাজের ধাপ\"-এ যে টিক আর তারিখ দেওয়া আছে, সেই অনুযায়ী মেমোতে পরিশোধ আর বাকি দেখাবে।", "Payments and dues on the memo follow the ticks and dates in \"Work steps\"."], ["PDF পড়া গেল না। ইন্টারনেট চালু আছে কিনা দেখুন, অথবা PDF-এর লেখা কপি করে পেস্ট করুন।", "Couldn't read the PDF. Check your internet, or copy-paste the PDF's text."], ["ইন্টারনেট নেই, তাই এখন লগইন করা যাচ্ছে না। পিসিতে সব সেভ হচ্ছে, নেট এলে সিঙ্ক হবে।", "No internet, so login isn't possible right now. Everything is saved on this PC and will sync when you're online."], ["টিম, ফোন, মেমো নং, প্লেয়ারের নাম, ফ্যাব্রিক, ট্র্যাকিং… যেকোনো কিছু দিয়ে খুঁজুন", "Search by team, phone, memo no, player name, fabric, tracking… anything"], ["কপি করে প্রোভাইডারকে WhatsApp/মেসেঞ্জারে পাঠান। এতে আপনার বিক্রির দাম বা লাভ নেই।", "Copy and send to the provider on WhatsApp/Messenger. It doesn't show your selling price or profit."], ["Google Cloud থেকে পাওয়া Client ID আর Client secret এখানে একবার বসিয়ে সেভ করুন।", "Paste the Client ID and Client secret from Google Cloud here once and save."], ["ওই পেজেই \"এটা দিয়ে অর্ডার খুলুন\" চাপুন। টিমের নাম, ফোন, ঠিকানা দিয়ে সেভ করুন।", "On the same page press \"Open an order from this\". Add team name, phone and address, then save."], ["ডেটা এখন শুধু এই ব্রাউজারে আছে, সেভ হবে না। লিংকটা claude.ai-তে লগইন করে খুলুন।", "Data is only in this browser and won't be saved. Open the link while signed in to claude.ai."], ["প্রোভাইডারের দাম বসানো নেই (? চিহ্ন)। \"দাম ও সেটিং\" পেজে প্রোভাইডারের দাম দিন।", "Provider prices are missing (? marks). Add them on the \"Prices & settings\" page."], ["ডিজাইন চার্জ, প্যান্ট, মোজা, ডেলিভারি ইত্যাদি আলাদা কিছু থাকলে এখানে যোগ করুন।", "Add anything separate here — design charge, shorts, socks, delivery, etc."], ["\"মিরপুর স্ট্রাইকার্স, ২০টা পোলো হাফ হাতা পিপি, ১০টা রাউন্ড ফুল হাতা বার্ডস আই\"", "\"Mirpur Strikers, 20 polo half sleeve PP, 10 round full sleeve Birds Eye\""], ["এখানে সরাসরি ডাউনলোড হচ্ছে না। ছবির উপর রাইট-ক্লিক বা লং-প্রেস করে সেভ করুন।", "Direct download isn't available here. Right-click or long-press the image to save it."], ["নতুন দাম শুধু নতুন অর্ডার আর নতুন হিসাবে লাগবে। আগের অর্ডারের দাম বদলাবে না।", "New prices apply only to new orders and calculations. Existing orders keep their prices."], ["বুঝতে পারিনি। জার্সির ধরন আর পিস লিখুন, যেমন: \"পোলো হাফ হাতা পিপি ২০ পিস\"।", "Didn't understand. Write the jersey type and pieces, e.g. \"Polo half sleeve PP 20 pcs\"."], ["অর্ডারে ঢুকে \"কাজের ধাপ\"-এ প্রথম টিক দিন। লিস্ট ফাইনাল হলে দ্বিতীয় টিক।", "Open the order and tick the first box under \"Work steps\". Tick the second once the list is final."], ["কাস্টমারের মেসেজ পেস্ট করুন, PDF বা ছবি দিন, অথবা নিজের মতো লিখুন। যেমন:", "Paste a customer message, add a PDF or image, or just write it your way. For example:"], ["প্রতি লাইনে একজন: নাম, নাম্বার, সাইজ, হাফ/ফুল। যেমন: Rakib, 10, L, হাফ", "One per line: name, number, size, half/full. Example: Rakib, 10, L, half"], ["ছবি পড়তে AI লাগে, যা এখানে চালু নেই। ছবির লেখা টাইপ বা পেস্ট করে দিন।", "Reading images needs AI, which isn't available here. Type or paste the text instead."], ["কুরিয়ারে পাঠালে, COD পেলে আর প্রোভাইডারের বাকি দিলে একে একে টিক দিন।", "Tick each step as you ship by courier, receive COD and pay the provider's due."], ["টিম নেম, প্লেয়ার নেম, নাম্বার ও লোগো ফ্রি — কোনো এক্সট্রা চার্জ নেই।", "Team name, player name, number and logo free — no extra charge."], ["টিম নেম, প্লেয়ার নেম, নাম্বার ও লোগো ফ্রি, কোনো এক্সট্রা চার্জ নেই।", "Team name, player name, number and logo free — no extra charge."], ["-এর পুরো হিসাব এক PDF-এ: বিক্রি, লাভ, কত টাকা এসেছে আর কত দিয়েছেন।", "'s full summary in one PDF: sales, profit, money in and money out."], ["প্রোভাইডারের দামের লিস্ট বসানো নেই, তাই মোট বিল নিজে লিখে দিন।", "Provider price list isn't set, so enter the total bill yourself."], ["ফ্যাব্রিক, হাতা আর কলার বাছলেই প্রাইস লিস্ট থেকে দাম নিজে বসে।", "Pick fabric, sleeve and collar and the price fills in from your price list."], ["ফ্যাব্রিক GSM ১৭০–১৮০ · সাইজে ±০.৫ ইঞ্চি এদিক-সেদিক হতে পারে।", "Fabric GSM 170–180 · sizes may vary by ±0.5 in const BNRE=/[\u0980-\u09FF]/;
function tr(str){str=String(str??'');if(lang!=='en'||!BNRE.test(str))return str;for(const [a,b] of DICT)if(str.includes(a))str=str.split(a).join(b);return str.replace(/।/g,'.').replace(/(\d)\s?টা/g,'$1').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d))}
const ORIG=new Map(),SKIP=new Set(['TEXTAREA','SCRIPT','STYLE','INPUT']);
function trTree(root){if(lang!=='en'||!root)return;
 const doText=t=>{const v=t.nodeValue;if(!v||!BNRE.test(v)||SKIP.has(t.parentNode?.nodeName))return;const r=tr(v);if(r!==v){if(!ORIG.has(t))ORIG.set(t,v);t.nodeValue=r}};
 if(root.nodeType===3){doText(root);return}if(root.nodeType!==1||SKIP.has(root.nodeName))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())doText(t);
 for(const el of [root,...root.querySelectorAll('[placeholder],[aria-label],[title]')])for(const at of ['placeholder','aria-label','title']){const v=el.getAttribute&&el.getAttribute(at);if(v&&BNRE.test(v)){el.dataset['bn_'+at.replace('-','_')]=v;el.setAttribute(at,tr(v))}}}
function untrAll(){for(const [t,v] of ORIG)if(t.isConnected)t.nodeValue=v;ORIG.clear();
 for(const el of document.querySelectorAll('*'))for(const at of ['placeholder','aria-label','title']){const k='bn_'+at.replace('-','_');if(el.dataset&&el.dataset[k]!=null){el.setAttribute(at,el.dataset[k]);delete el.dataset[k]}}}
new MutationObserver(ms=>{if(lang!=='en')return;for(const m of ms){if(m.type==='characterData')trTree(m.target);else for(const nd of m.addedNodes)trTree(nd)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(_){}document.documentElement.lang=l;$('#langbtn').textContent=l==='en'?'বাংলা':'English';if(l==='en')trTree(document.body);else untrAll();render()}
const toast=m=>{m=tr(m);const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};

/* ---------- pricing ---------- */
function mkey(sleeve,collar){return (POLOISH.includes(collar)?'p':'r')+(sleeve===FULL?'f':'h')}
function unit(fab,sleeve,collar,kind){
 const f=cfg.fabrics.find(x=>x.name===fab),v=f&&f[kind]?f[kind].rh:'';if(blank(v))return '';
 return n(v)+(sleeve===FULL?n(cfg.ex.full?.[kind]):0)+(POLOISH.includes(collar)?n(cfg.ex.polo?.[kind]):0);
}
function normOrder(o){if(!Array.isArray(o.blocks)||!o.blocks.length){o.blocks=[{id:'b1',fabric:o.fabric||cfg.fabrics[0]?.name||''}]}
 o.items=o.items||[];for(const it of o.items)if(!it.blk||!o.blocks.some(b=>b.id===it.blk))it.blk=o.blocks[0].id;return o}
const fabOf=(o,it)=>((o.blocks||[]).find(b=>b.id===it.blk)||{}).fabric||o.fabric||'';
const fabList=o=>[...new Set((o.blocks&&o.blocks.length?o.blocks.map(b=>b.fabric):[o.fabric]).filter(Boolean))];
function reprice(it,fab){it.sell=unit(fab,it.sleeve,it.collar,'sell');it.cost=unit(fab,it.sleeve,it.collar,'cost');it.bigSell=n(cfg.ex.big.sell);it.bigCost=n(cfg.ex.big.cost)}
function newLine(o,sleeve,collar=COLLARS[0],blk){normOrder(o);const it={blk:blk||o.blocks[0].id,sleeve,collar,qty:'',big:''};reprice(it,fabOf(o,it));return it}
function newBlock(o,fabric){normOrder(o);const used=o.blocks.map(b=>b.fabric);const f=fabric||(cfg.fabrics.find(z=>!used.includes(z.name))||cfg.fabrics[0]||{}).name||'';const b={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),fabric:f};o.blocks.push(b);return b}
function calc(o){
 let sub=0,F=0,pcs=0,big=0,noCost=false;
 for(const it of o.items||[]){const k=n(it.qty),b=n(it.big);pcs+=k;big+=b;sub+=k*n(it.sell)+b*n(it.bigSell);if(k&&blank(it.cost))noCost=true;else F+=k*n(it.cost)+b*n(it.bigCost)}
 for(const e of o.extras||[]){const q=blank(e.qty)?1:n(e.qty);sub+=q*n(e.sell);F+=q*n(e.cost);if(!blank(e.qty))pcs+=q}
 const Fauto=F;if(!blank(o.provTotal)){F=n(o.provTotal);noCost=false}
 const T=Math.max(0,sub+n(o.addCharge)-n(o.discount)),P=T-F;
 const md=o.advMode,A=md==='full'?T:md==='pct'?Math.round(T*n(o.advP)/100):md==='amt'?Math.min(T,n(o.advance)):(blank(o.advance)?Math.round(T*n(cfg.advPct)/100):n(o.advance));
 const fAdv=Math.max(0,Math.min(F,A-P)),fDue=F-fAdv,cod=T-A,c=n(o.courierCharge);
 return {pcs,big,T,F,Fauto,P,A,fAdv,fDue,cod,c,net:P-c,noCost};
}
const lineTotal=it=>n(it.qty)*n(it.sell)+n(it.big)*n(it.bigSell);
const provLine=it=>n(it.qty)*n(it.cost)+n(it.big)*n(it.bigCost);
const desOf=(o,it)=>((o.blocks||[]).find(b=>b.id===it.blk)||{}).design||'';
const lineName=(o,it)=>`${fabOf(o,it)}${desOf(o,it)?' ('+desOf(o,it)+')':''} · ${it.collar} · ${it.sleeve}`;

/* ---------- name & size list ---------- */
function parseRoster(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[,،|\t]/).map(x=>x.trim());
 let size=toEn(p[2]||'').toUpperCase().replace(/\s/g,'');const xs=size.match(/^(X{4,9})L$/);if(xs)size=xs[1].length+'XL';
 const sl=/ফুল|full|^f$|long/i.test(p[3]||'')?FULL:HALF;return {name:p[0]||'',no:p[1]||'',size,sl,big:/^([4-9])XL$/.test(size)}})}
function analysis(o){const k=calc(o),R=[];
 for(const it of o.items){const q2=n(it.qty);if(!q2)continue;const b=n(it.big),cs=q2*n(it.sell)+b*n(it.bigSell),nc=blank(it.cost),dc=nc?0:q2*n(it.cost)+b*n(it.bigCost);
  R.push(`<tr><td>${esc(lineName(o,it))}${b?` <span class="mut">(4XL+ ${bn(b)})</span>`:''}</td><td class="n">${bn(q2)}</td><td class="n">${tk(n(it.sell))}</td><td class="n">${nc?'?':tk(n(it.cost))}</td><td class="n c-sale">${tk(cs)}</td><td class="n c-prov">${nc?'?':tk(dc)}</td><td class="n c-profit">${nc?'?':tk(cs-dc)}</td></tr>`)}
 if(!R.length)return '<p class="mut" style="margin:0">পিস সংখ্যা দিলে এখানে পুরো হিসাব দেখাবে।</p>';
 const d=n(o.discount),ac=n(o.addCharge);
 return `<p style="margin:0 0 6px"><b>মোট:</b> ${bn(k.pcs)} পিস · ${fabList(o).map(esc).join(', ')}</p><div class="scroll"><table class="stack"><thead><tr><th>জার্সি</th><th class="n">পিস</th><th class="n">কাস্টমার/পিস</th><th class="n">প্রোভাইডার/পিস</th><th class="n">কাস্টমার মোট</th><th class="n">প্রোভাইডার মোট</th><th class="n">লাভ</th></tr></thead><tbody>${R.join('')}
 ${ac?`<tr><td>অতিরিক্ত চার্জ</td><td></td><td></td><td></td><td class="n">+${tk(ac)}</td><td></td><td class="n">+${tk(ac)}</td></tr>`:''}
 ${d?`<tr><td>ছাড়</td><td></td><td></td><td></td><td class="n">−${tk(d)}</td><td></td><td class="n">−${tk(d)}</td></tr>`:''}

function pdfBytes(cvs){if(!Array.isArray(cvs))cvs=[cvs];

 cvs.forEach((cv,i)=>{const b=3+i*3,bin=atob(cv.toDataURL('image/jpeg',.94).split(',')[1]),img=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)img[j]=bin.charCodeAt(j);
  const w=cv.width,h=cv.height,pw=595.28,ph=+(pw*h/w).toFixed(2);
  obj(b,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${b+1} 0 R >> >> /Contents ${b+2} 0 R >>`);
  off[b+1]=len;push(`${b+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);push(img);push('\nendstream\nendobj\n');
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(b+2,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)});

async function pdfImages(file,max=3){const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise,out=[];
 for(let p=1;p<=Math.min(max,doc.numPages);p++){const pg=await doc.getPage(p),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}return out}
async function readSources(files,text,ai,say,btn){let txt=text||'',imgs=[];
 try{for(const f of files||[]){if(/^image\//.test(f.type)){imgs.push(f);continue}
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){if(window.BR_WEB&&aiOK){imgs.push(f);try{txt=(await pdfText(f))+'\n'+txt}catch(_){}continue}say('PDF পড়া হচ্ছে…');let t='';try{t=await pdfText(f)}catch(_){throw {code:'pdf'}}
   if(t.replace(/\s/g,'').length<20){say('PDF-এ লেখা নেই (স্ক্যান করা), ছবি হিসেবে পড়া হচ্ছে…');imgs.push(...await pdfImages(f))}txt=t+'\n'+txt}
  else txt=(await f.text())+'\n'+txt}}
 catch(e){say('');toast(e&&e.code==='pdf'?'PDF পড়া গেল না। ইন্টারনেট চালু আছে কিনা দেখুন, অথবা PDF-এর লেখা কপি করে পেস্ট করুন।':'ফাইল পড়া গেল না');return null}
 if(!txt.trim()&&!imgs.length){toast('আগে ফাইল দিন বা লেখা পেস্ট করুন');return null}
 let parseTxt=txt;
 if(imgs.length||ai){say('AI দিয়ে পড়া হচ্ছে…');if(btn)btn.disabled=true;
  try{parseTxt=await aiRead(txt,imgs)}catch(e){say('');
   if(imgs.length&&!txt.trim()){if(btn)btn.disabled=false;toast(e&&e.code==='no_ai'?'ছবি পড়তে AI লাগে, যা এখানে চালু নেই। ছবির লেখা টাইপ বা পেস্ট করে দিন।':'AI দিয়ে পড়া গেল না, আবার চেষ্টা করুন।');return null}
   toast('AI ছাড়াই পড়া হলো');parseTxt=txt}if(btn)btn.disabled=false}
 say('');return {src:txt||parseTxt,parseTxt}}

async function aiRead(text,images,current,msg){const sample=window.claude&&claude.use?await claude.use('sample'):null;if(!sample)throw {code:'no_ai'};
 let imgs=images||[];try{const lim=await sample.limits();if(!lim||!lim.images)imgs=[]}catch(_){imgs=[]}
 if(!imgs.length&&!String(text||'').trim()&&!msg)throw {code:'no_ai_img'};
 const prompt=`You are the order assistant inside a Bangladeshi custom sports-jersey shop's software. The owner talks to you in Bangla, English or a mix (Banglish), and may paste customer chats, PDFs' text or images.
${current&&current!=='(empty)'?`CURRENT ORDER:\n${current}\n\nUpdate the current order according to the owner's message (add, change or remove what they say; keep everything else). If the message is clearly a brand-new order, replace it.`:'Build the order from the material below.'}
Output ONLY the full order in exactly this format, nothing else:
${AIFMT}
Rules:
- Keep every player name exactly as written (same spelling and script). Never translate or invent names.
- Sizes: XS, S, M, L, XL, 2XL, 3XL, 4XL, 5XL, 6XL or CUSTOM (XXL=2XL, XXXL=3XL).
- Sleeve: Half or Full. Collar: Round Neck, V Neck, Polo Collar, Double V Neck or Custom. (গলা/নেক = neck, হাফ হাতা = half sleeve, ফুল হাতা = full sleeve, পোলো = polo.)
- Fabric must be one of: ${cfg.fabrics.map(f=>f.name).join(', ')} (পিপি = PP / Interlock, বার্ডস আই = Birds Eye Mesh, etc.). If no fabric is stated anywhere, use ${cfg.fabrics[0]?.name||'the first fabric'}.
- Bangla numerals are numbers (২০ = 20). If piece counts are not stated, count them from the players by sleeve.
- Read every page, table row and image carefully. Count pieces exactly: if a table lists players, each row is one jersey; add up quantities per fabric + collar + sleeve. Never skip or double-count rows; ignore serial numbers, totals rows and headers as players.
- Sizes 4XL, 5XL and 6XL must be listed with their player rows so the software can add the big-size charge.
- Omit lines you cannot fill. Never write prices — the software prices everything itself.
${msg?`\nOWNER'S MESSAGE:\n${msg}\n`:''}${String(text||'').trim()?`\nATTACHED MATERIAL:\n${String(text).slice(0,30000)}\n`:''}${imgs.length?'\n(Images of the order are attached.)':''}`;
 const res=await sample(prompt,{images:imgs,modelTier:'default'});return res.text||''}
